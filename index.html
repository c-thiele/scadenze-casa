<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scadenze di casa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24584b">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#eef2ef;--surface:#fff;--surface-2:#e8eeeb;--ink:#1c2826;--muted:#5f6d69;--line:#dbe3df;
  --brand:#24584b;--brand-ink:#fff;--brand-soft:#dcebe5;
  --head-bg:#24584b;--head-ink:#fff;
  --rosso:#b42318;--rosso-soft:#fde8e6;--arancio:#a86400;--arancio-soft:#fdf0d9;--verde:#2f7d4f;--verde-soft:#e2f2e8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121816;--surface:#1b2321;--surface-2:#25302d;--ink:#e6ece9;--muted:#9aa8a3;--line:#2b3532;
  --brand:#6cc0a6;--brand-ink:#0d1714;--brand-soft:#1f342d;
  --head-bg:#1a2b26;--head-ink:#e6ece9;
  --rosso:#f1786b;--rosso-soft:#3a1d1a;--arancio:#f0b14a;--arancio-soft:#3a2c14;--verde:#6cc48f;--verde-soft:#1b3326;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,h4,.data b,.stat b{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif}
.m{color:var(--muted)}

/* Intestazione */
header{background:var(--head-bg);color:var(--head-ink);padding:16px 16px 40px}
.testata{max-width:860px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titolo{flex:1;min-width:180px}
header h1{margin:0;font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
#oggi{margin:0;font-size:.92rem;opacity:.85}
#stato{font-size:.78rem;opacity:.75;margin-top:2px;min-height:1.1em}

/* Pulsanti */
button,.btn{font:inherit;font-size:.92rem;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--surface-2);color:var(--ink);display:inline-block}
button:hover,.btn:hover{filter:brightness(.97)}
header button{background:rgba(255,255,255,.14);color:inherit}
header button:hover{background:rgba(255,255,255,.26);filter:none}
header .nuova{background:var(--head-ink);color:var(--head-bg);font-weight:600;padding:9px 16px}
.ico{width:38px;height:38px;padding:0;display:inline-grid;place-items:center;font-size:1.05rem}
.primario{background:var(--brand);color:var(--brand-ink);font-weight:600}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header :focus-visible{outline-color:var(--head-ink)}

/* Riepilogo */
main{max-width:860px;margin:-26px auto 0;padding:0 14px 48px}
.riepilogo{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 24px -16px rgba(20,40,35,.45)}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat span{font-size:.8rem;color:var(--muted)}
.stat b{display:block;font-size:1.5rem;line-height:1.25;font-variant-numeric:tabular-nums}
.stat.rosso b{color:var(--rosso)}.stat.arancio b{color:var(--arancio)}
@media (max-width:560px){
  .riepilogo{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat b{font-size:1.25rem}
}

/* Ricerca e filtri */
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input,.bar select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);flex:1;min-width:150px}
.bar input{flex:2}

/* Lista */
.mese{display:flex;justify-content:space-between;font-size:.95rem;font-weight:700;color:var(--muted);margin:22px 4px 8px}
.mese.rossa{color:var(--rosso)}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.data{width:56px;height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand)}
.data b{font-size:1.45rem;line-height:1;font-variant-numeric:tabular-nums}
.data span{font-size:.75rem;font-weight:600;margin-top:2px}
.data small{font-size:.65rem;opacity:.85}
.item.vicina .data{background:var(--arancio-soft);color:var(--arancio)}
.item.scaduta .data{background:var(--rosso);color:#fff}
.info{min-width:0}
.t{font-weight:650;font-size:1.02rem;overflow-wrap:anywhere}
.quando{font-size:.86rem;font-weight:600;color:var(--brand)}
.item.vicina .quando{color:var(--arancio)}.item.scaduta .quando{color:var(--rosso)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.76rem;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-decoration:none}
a.chip{color:var(--brand);font-weight:600}
.nota{font-size:.86rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.az{display:flex;gap:4px;align-items:center}
.az .ok{background:var(--verde-soft);color:var(--verde);font-weight:600}
.az .ok:hover{background:var(--verde);color:#fff;filter:none}
.az .ico{width:36px;height:36px;background:transparent;color:var(--muted)}
.az .ico:hover{background:var(--surface-2)}
@media (max-width:560px){
  .item{grid-template-columns:52px 1fr}
  .az{grid-column:1/-1;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px}
}
.vuoto{text-align:center;padding:40px 16px;color:var(--muted)}
.vuoto p{margin:0 0 14px}

/* Finestre */
dialog{border:0;border-radius:18px;padding:20px;max-width:500px;width:94%;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px -24px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(15,25,22,.45);backdrop-filter:blur(2px)}
dialog[open]{animation:comparsa .18s ease-out}
@keyframes comparsa{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog h3{margin:0 0 4px;font-size:1.2rem}
dialog label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-top:12px}
dialog input,dialog select,dialog textarea{display:block;width:100%;margin-top:4px;font:inherit;font-weight:400;color:var(--ink);background:var(--bg);padding:10px 12px;border:1px solid var(--line);border-radius:10px}
dialog textarea{resize:vertical}
dialog input:focus,dialog select:focus,dialog textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
dialog label.btn{display:inline-block;margin:0;color:var(--ink);font-weight:400;font-size:.92rem}
.modello{background:var(--brand-soft);padding:2px 12px 12px;border-radius:12px;margin-top:10px}
.riga{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.piede{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.sez{border-top:1px solid var(--line);margin-top:14px}
.sez h4{margin:12px 0 0;font-size:.98rem}
.sez p{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.storico-riga{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.storico-riga span:first-child,.storico-riga span:last-child{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
</style>
</head>
<body>
<header>
  <div class="testata">
    <div class="titolo">
      <h1>Scadenze di casa</h1>
      <p id="oggi"></p>
      <div id="stato"></div>
    </div>
    <button class="nuova" onclick="apri()">+ Nuova</button>
    <button class="ico" onclick="apriStorico()" aria-label="Storico" title="Storico">🕘</button>
    <button class="ico" onclick="pull()" aria-label="Sincronizza" title="Sincronizza">⟳</button>
    <button class="ico" onclick="apriImpostazioni()" aria-label="Impostazioni" title="Impostazioni">⚙</button>
  </div>
</header>
<main>
  <div class="riepilogo" id="riepilogo"></div>
  <div class="bar">
    <input id="cerca" type="search" placeholder="Cerca per nome o nota" oninput="render()" aria-label="Cerca">
    <select id="filtroCat" onchange="render()" aria-label="Filtra per categoria"></select>
  </div>
  <div id="lista"></div>
</main>

<!-- Nuova / modifica -->
<dialog id="dlgVoce"><form id="form">
  <h3>Scadenza</h3>
  <div id="boxModello" class="modello"><label>Parti da un modello (facoltativo)
    <select id="modello"><option value="">— scegli —</option></select></label></div>
  <input type="hidden" name="vid">
  <label>Descrizione *<input name="titolo" required></label>
  <div class="riga">
    <label>Categoria<select name="categoria"></select></label>
    <label>Scadenza *<input type="date" name="scadenza" required></label>
  </div>
  <div class="riga">
    <label>Ripeti<select name="ricTipo">
      <option value="nessuna">Mai</option><option value="giorni">Ogni N giorni</option>
      <option value="mesi">Ogni N mesi</option><option value="anni">Ogni N anni</option></select></label>
    <label>N<input type="number" name="ricOgni" min="1" value="1"></label>
  </div>
  <div class="riga">
    <label>Avvisami (giorni prima)<input type="number" name="preavviso" min="0" value="30"></label>
    <label>Importo (€)<input type="number" name="importo" step="0.01" min="0"></label>
  </div>
  <label>Link al documento<input name="link" type="url" placeholder="https://mega.nz/..."></label>
  <label>Note<textarea name="note" rows="2"></textarea></label>
  <div class="piede">
    <button type="button" onclick="$('#dlgVoce').close()">Annulla</button>
    <button class="primario">Salva</button>
  </div>
</form></dialog>

<!-- Storico -->
<dialog id="dlgStorico">
  <h3>Storico</h3>
  <div id="storicoLista" style="max-height:60vh;overflow:auto"></div>
  <div class="piede"><button onclick="$('#dlgStorico').close()">Chiudi</button></div>
</dialog>

<!-- Impostazioni -->
<dialog id="dlgCfg">
  <h3>Impostazioni</h3>
  <section class="sez">
    <h4>Archivio cloud</h4>
    <p>Serve per avere gli stessi dati su più dispositivi.</p>
    <label>Token GitHub (solo permesso "gist")<input id="cfgToken" type="password" autocomplete="off"></label>
    <label>Gist ID<input id="cfgGist" placeholder="vuoto al primo avvio"></label>
    <div class="azioni"><button onclick="creaGist()">Crea archivio cloud</button></div>
  </section>
  <section class="sez">
    <h4>Avvisi e calendario</h4>
    <div class="azioni">
      <button onclick="attivaNotifiche()">Attiva notifiche qui</button>
      <button onclick="esportaICS()">Esporta calendario (.ics)</button>
    </div>
  </section>
  <section class="sez">
    <h4>Backup</h4>
    <div class="azioni">
      <button onclick="scarica('scadenze-backup-'+iso(oggi())+'.json',JSON.stringify(dati,null,1),'application/json')">Scarica backup</button>
      <label class="btn">Ripristina da file<input type="file" accept=".json" hidden onchange="ripristina(event)"></label>
    </div>
  </section>
  <div class="piede">
    <button onclick="$('#dlgCfg').close()">Chiudi</button>
    <button class="primario" onclick="salvaCfg()">Salva e sincronizza</button>
  </div>
</dialog>

<script>
const CATEGORIE=['Auto/Moto','Casa','Utenze','Tasse e tributi','Assicurazioni','Documenti','Salute','Animali','Abbonamenti','Garanzie','Altro'];
// [categoria, ogni N, tipo ricorrenza, preavviso giorni] — valori indicativi, modificabili
const MODELLI={'Bollo auto':['Auto/Moto',1,'anni',15],'Revisione auto':['Auto/Moto',2,'anni',30],'Tagliando auto':['Auto/Moto',1,'anni',30],
 'Assicurazione RCA':['Assicurazioni',1,'anni',30],'Assicurazione casa':['Assicurazioni',1,'anni',30],'Manutenzione caldaia':['Casa',1,'anni',30],
 "Carta d'identità":['Documenti',10,'anni',90],'Passaporto':['Documenti',10,'anni',90],'Patente':['Documenti',10,'anni',90],
 'IMU acconto':['Tasse e tributi',1,'anni',15],'IMU saldo':['Tasse e tributi',1,'anni',15],'TARI':['Tasse e tributi',1,'anni',15],
 'Antiparassitario':['Animali',1,'mesi',3],'Vaccino animale':['Animali',1,'anni',30],'Abbonamento':['Abbonamenti',1,'anni',15],
 'Token GitHub app scadenze':['Altro',1,'anni',15],'Fine garanzia':['Garanzie',1,'nessuna',30]};
const LS='scadenze_dati',LSC='scadenze_config',FILE='scadenze.json',API='https://api.github.com/gists';
let dati=JSON.parse(localStorage.getItem(LS)||'{"items":[],"storico":[],"aggiornato":0}');
let cfg=JSON.parse(localStorage.getItem(LSC)||'{}');
const $=s=>document.querySelector(s);
const oggi=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const giorni=s=>Math.round((parse(s)-oggi())/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=n=>(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const nuovoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const salvaCfgLocale=()=>localStorage.setItem(LSC,JSON.stringify(cfg));
const stato=m=>$('#stato').textContent=m;
const maiusc=t=>t.charAt(0).toUpperCase()+t.slice(1);
const PLUR={giorni:['giorno','giorni'],mesi:['mese','mesi'],anni:['anno','anni']};
const ogniTxt=i=>{const n=i.ricOgni||1,p=PLUR[i.ricTipo];return n===1?`ogni ${p[0]}`:`ogni ${n} ${p[1]}`};
const quandoTxt=g=>g<0?`Scaduta da ${-g} ${-g===1?'giorno':'giorni'}`:g===0?'Oggi':g===1?'Domani':`Tra ${g} giorni`;
const meseTxt=s=>maiusc(parse(s).toLocaleDateString('it-IT',{month:'long',year:'numeric'}));

function aggiungi(s,tipo,n){
  const d=parse(s);
  if(tipo==='giorni'){d.setDate(d.getDate()+n);return iso(d)}
  const mesi=tipo==='anni'?12*n:n,g=d.getDate();
  d.setDate(1);d.setMonth(d.getMonth()+mesi);
  d.setDate(Math.min(g,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
  return iso(d);
}

function salva(){dati.aggiornato=Date.now();localStorage.setItem(LS,JSON.stringify(dati));render();pushDebounced()}

function voceHTML(i){
  const g=giorni(i.scadenza),cl=g<0?'scaduta':g<=i.preavviso?'vicina':'',d=parse(i.scadenza);
  const anno=d.getFullYear()!==new Date().getFullYear()?`<small>${d.getFullYear()}</small>`:'';
  const chips=[`<span class="chip">${esc(i.categoria)}</span>`];
  if(i.ricTipo!=='nessuna')chips.push(`<span class="chip">↻ ${ogniTxt(i)}</span>`);
  if(i.importo)chips.push(`<span class="chip">${euro(i.importo)}</span>`);
  if(i.link&&/^https?:/.test(i.link))chips.push(`<a class="chip" href="${esc(i.link)}" target="_blank" rel="noopener">📎 Documento</a>`);
  return `<article class="item ${cl}">
    <div class="data" title="${d.toLocaleDateString('it-IT')}"><b>${d.getDate()}</b><span>${d.toLocaleDateString('it-IT',{month:'short'})}</span>${anno}</div>
    <div class="info"><div class="t">${esc(i.titolo)}</div><div class="quando">${quandoTxt(g)}</div>
      <div class="chips">${chips.join('')}</div>${i.note?`<div class="nota">${esc(i.note)}</div>`:''}</div>
    <div class="az"><button class="ok" onclick="fatto('${i.id}')">✓ Fatto</button>
      <button class="ico" onclick="apri('${i.id}')" aria-label="Modifica" title="Modifica">✎</button>
      <button class="ico" onclick="elimina('${i.id}')" aria-label="Elimina" title="Elimina">🗑</button></div>
  </article>`;
}

function render(){
  $('#oggi').textContent=maiusc(new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}));
  const q=$('#cerca').value.toLowerCase(),cat=$('#filtroCat').value,o=iso(oggi()),tra12=aggiungi(o,'mesi',12);
  let nScad=0,nVic=0,spesa=0;
  dati.items.forEach(i=>{
    const g=giorni(i.scadenza);
    if(g<0)nScad++;else if(g<=i.preavviso)nVic++;
    if(i.importo){let d=i.scadenza,k=0;
      while(d<=tra12&&k<400){if(d>=o)spesa+=i.importo;if(i.ricTipo==='nessuna')break;d=aggiungi(d,i.ricTipo,i.ricOgni||1);k++}}
  });
  const anno=String(new Date().getFullYear());
  const speso=(dati.storico||[]).filter(x=>x.fatto.startsWith(anno)).reduce((a,x)=>a+(x.importo||0),0);
  $('#riepilogo').innerHTML=`<div class="stat ${nScad?'rosso':''}"><span>Scadute</span><b>${nScad}</b></div>
    <div class="stat ${nVic?'arancio':''}"><span>In arrivo</span><b>${nVic}</b></div>
    <div class="stat"><span>Previste nei prossimi 12 mesi</span><b>${euro(spesa)}</b></div>
    <div class="stat"><span>Speso nel ${anno}</span><b>${euro(speso)}</b></div>`;
  const lista=dati.items.filter(i=>(!cat||i.categoria===cat)&&(!q||(i.titolo+' '+(i.note||'')).toLowerCase().includes(q)))
    .sort((a,b)=>a.scadenza.localeCompare(b.scadenza));
  const gruppi=[];
  lista.forEach(i=>{
    const k=giorni(i.scadenza)<0?'Scadute':meseTxt(i.scadenza);
    let gr=gruppi[gruppi.length-1];
    if(!gr||gr.k!==k)gruppi.push(gr={k,v:[]});
    gr.v.push(i);
  });
  $('#lista').innerHTML=gruppi.map(gr=>`<section><h2 class="mese ${gr.k==='Scadute'?'rossa':''}"><span>${gr.k}</span><span>${gr.v.length}</span></h2>${gr.v.map(voceHTML).join('')}</section>`).join('')
    ||(dati.items.length
      ?'<div class="vuoto"><p>Nessuna scadenza corrisponde alla ricerca.</p></div>'
      :'<div class="vuoto"><p>Non hai ancora inserito scadenze.</p><button class="primario" onclick="apri()">Aggiungi la prima</button></div>');
}

function apri(id){
  const i=id?dati.items.find(x=>x.id===id):{id:'',titolo:'',categoria:'Casa',scadenza:iso(oggi()),preavviso:30,ricTipo:'nessuna',ricOgni:1,importo:0,note:'',link:''};
  const f=$('#form').elements;
  f.vid.value=i.id;f.titolo.value=i.titolo;f.categoria.value=i.categoria;f.scadenza.value=i.scadenza;
  f.ricTipo.value=i.ricTipo;f.ricOgni.value=i.ricOgni||1;f.preavviso.value=i.preavviso;
  f.importo.value=i.importo||'';f.note.value=i.note||'';f.link.value=i.link||'';
  $('#modello').value='';$('#boxModello').style.display=id?'none':'';
  $('#dlgVoce').showModal();
}
$('#form').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.elements;
  const v={id:f.vid.value||nuovoId(),titolo:f.titolo.value.trim(),categoria:f.categoria.value,scadenza:f.scadenza.value,
    ricTipo:f.ricTipo.value,ricOgni:Math.max(1,parseInt(f.ricOgni.value)||1),preavviso:Math.max(0,parseInt(f.preavviso.value)||0),
    importo:parseFloat(f.importo.value)||0,link:f.link.value.trim(),note:f.note.value.trim()};
  const k=dati.items.findIndex(x=>x.id===v.id);
  if(k>=0)dati.items[k]=v;else dati.items.push(v);
  $('#dlgVoce').close();salva();
});
$('#modello').addEventListener('change',e=>{
  const m=MODELLI[e.target.value];if(!m)return;const f=$('#form').elements;
  f.titolo.value=e.target.value;f.categoria.value=m[0];f.ricOgni.value=m[1];f.ricTipo.value=m[2];f.preavviso.value=m[3];
});

function fatto(id){
  const i=dati.items.find(x=>x.id===id);if(!i)return;
  const ric=i.ricTipo!=='nessuna';
  if(!ric&&!confirm(`"${i.titolo}" non è ricorrente: la segno come fatta e la tolgo dalla lista?`))return;
  let imp=i.importo||0;
  if(i.importo){const r=prompt('Importo effettivamente pagato (€):',i.importo);if(r===null)return;imp=Number(r.replace(',','.'))||0}
  (dati.storico??=[]).push({titolo:i.titolo,categoria:i.categoria,scadenza:i.scadenza,fatto:iso(oggi()),importo:imp});
  if(ric)i.scadenza=aggiungi(i.scadenza,i.ricTipo,i.ricOgni||1);
  else dati.items=dati.items.filter(x=>x!==i);
  salva();
}
function elimina(id){const i=dati.items.find(x=>x.id===id);if(i&&confirm(`Eliminare "${i.titolo}"?`)){dati.items=dati.items.filter(x=>x!==i);salva()}}

function apriStorico(){
  const s=(dati.storico||[]).slice().reverse();
  $('#storicoLista').innerHTML=s.map(x=>`<div class="storico-riga"><span class="m">${parse(x.fatto).toLocaleDateString('it-IT')}</span>
    <span>${esc(x.titolo)}</span><span>${x.importo?euro(x.importo):''}</span></div>`).join('')||'<p class="m">Qui compariranno le scadenze segnate come fatte.</p>';
  $('#dlgStorico').showModal();
}

/* ---- Sincronizzazione con Gist GitHub ---- */
const hdr=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
async function pull(){
  if(!cfg.token||!cfg.gistId){stato('Solo su questo dispositivo (configura il cloud in ⚙)');return}
  stato('Sincronizzo…');
  try{
    const r=await fetch(`${API}/${cfg.gistId}`,{headers:hdr(),cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const f=(await r.json()).files[FILE];
    if(!f)return push();
    const remoto=JSON.parse(f.truncated?await (await fetch(f.raw_url)).text():f.content);
    if((remoto.aggiornato||0)>(dati.aggiornato||0)){dati=remoto;localStorage.setItem(LS,JSON.stringify(dati));render();stato('Aggiornato dal cloud ✓')}
    else if((remoto.aggiornato||0)<(dati.aggiornato||0))await push();
    else stato('Sincronizzato ✓');
  }catch(e){stato('Sync non riuscita ('+e.message+'): uso i dati locali')}
}
async function push(){
  if(!cfg.token||!cfg.gistId)return;
  try{
    const r=await fetch(`${API}/${cfg.gistId}`,{method:'PATCH',headers:hdr(),body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(dati,null,1)}}})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    stato('Salvato nel cloud ✓ '+new Date().toLocaleTimeString('it-IT'));
  }catch(e){stato('Salvataggio cloud non riuscito ('+e.message+'), dati tenuti in locale')}
}
let tPush;function pushDebounced(){clearTimeout(tPush);tPush=setTimeout(push,1500)}

function apriImpostazioni(){$('#cfgToken').value=cfg.token||'';$('#cfgGist').value=cfg.gistId||'';$('#dlgCfg').showModal()}
async function salvaCfg(){cfg.token=$('#cfgToken').value.trim();cfg.gistId=$('#cfgGist').value.trim();salvaCfgLocale();$('#dlgCfg').close();await pull()}
async function creaGist(){
  const token=$('#cfgToken').value.trim();if(!token)return alert('Inserisci prima il token');
  const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},
    body:JSON.stringify({description:'Scadenze di casa (dati app)',public:false,files:{[FILE]:{content:JSON.stringify(dati,null,1)}}})});
  if(!r.ok)return alert('Errore '+r.status+': controlla il token (serve il permesso "gist")');
  const g=await r.json();$('#cfgGist').value=g.id;
  alert('Archivio creato.\nGist ID: '+g.id+'\nAnnotalo: serve sugli altri dispositivi e per le notifiche. Ora premi "Salva e sincronizza".');
}

/* ---- Notifiche locali (all'apertura) ---- */
async function attivaNotifiche(){
  if(!('Notification' in window))return alert('Questo browser non supporta le notifiche');
  if(await Notification.requestPermission()==='granted'){cfg.notif=true;cfg.ultimaNotif='';salvaCfgLocale();controllaNotifiche()}
}
async function controllaNotifiche(){
  if(!cfg.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  const o=iso(oggi());if(cfg.ultimaNotif===o)return;
  const urg=dati.items.filter(i=>giorni(i.scadenza)<=i.preavviso).sort((a,b)=>a.scadenza.localeCompare(b.scadenza));
  if(!urg.length)return;
  const body=urg.slice(0,6).map(i=>{const g=giorni(i.scadenza);return `${i.titolo}: ${g<0?'SCADUTA':g===0?'OGGI':'tra '+g+' gg'}`}).join('\n');
  try{const reg='serviceWorker' in navigator&&await navigator.serviceWorker.getRegistration();
    if(reg)reg.showNotification('Scadenze di casa',{body,icon:'icon.svg',tag:'scadenze'});else new Notification('Scadenze di casa',{body})}catch(e){}
  cfg.ultimaNotif=o;salvaCfgLocale();
}

/* ---- Calendario e backup ---- */
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function esportaICS(){
  const F={giorni:'DAILY',mesi:'MONTHLY',anni:'YEARLY'};
  const st=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scadenze casa//IT','CALSCALE:GREGORIAN'];
  dati.items.forEach(i=>{
    L.push('BEGIN:VEVENT','UID:'+i.id+'@scadenze-casa','DTSTAMP:'+st,
      'DTSTART;VALUE=DATE:'+i.scadenza.replace(/-/g,''),'DTEND;VALUE=DATE:'+aggiungi(i.scadenza,'giorni',1).replace(/-/g,''),
      'SUMMARY:'+icsEsc(i.titolo),'DESCRIPTION:'+icsEsc([i.categoria,i.importo?euro(i.importo):'',i.note,i.link].filter(Boolean).join(' - ')));
    if(F[i.ricTipo])L.push(`RRULE:FREQ=${F[i.ricTipo]};INTERVAL=${i.ricOgni||1}`);
    // avviso alle 9:00 del giorno "preavviso"
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(i.titolo),
      'TRIGGER:'+(i.preavviso>0?`-P${i.preavviso-1}DT15H`:'PT9H'),'END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');scarica('scadenze.ics',L.join('\r\n'),'text/calendar');
}
function scarica(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function ripristina(ev){
  const f=ev.target.files[0];if(!f)return;
  f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d.items))throw 0;
    if(confirm('Sostituire i dati attuali con quelli del backup?')){dati=d;dati.storico??=[];salva()}}).catch(()=>alert('File non valido'));
}

/* ---- Avvio ---- */
const opz=CATEGORIE.map(c=>`<option>${c}</option>`).join('');
$('#filtroCat').innerHTML='<option value="">Tutte le categorie</option>'+opz;
$('#form').elements.categoria.innerHTML=opz;
$('#modello').innerHTML+=Object.keys(MODELLI).map(k=>`<option>${esc(k)}</option>`).join('');
render();
pull().then(controllaNotifiche);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();pull()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script>
